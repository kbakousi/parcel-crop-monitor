[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parcelmon"
version = "0.1.0"
description = "Parcel-level crop and land-use checks with Sentinel-2 time series: rule-based states and events, out-of-fold Random Forest crop verification and traffic-light verdicts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Aikaterini Bakousi" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6",
  "xarray>=2023.1",
  "eolandscape[xarray] @ git+https://github.com/kbakousi/eo-landscape-indicators@v0.1.0",
]
keywords = ["sentinel-2", "crop classification", "CAP monitoring", "IACS", "parcel", "time series", "random forest"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2", "rasterio>=1.3"]
stac = ["eolandscape[stac] @ git+https://github.com/kbakousi/eo-landscape-indicators@v0.1.0"]
test = ["pytest>=7", "dask[array]>=2023.1", "nbclient>=0.7", "nbformat>=5.7", "ipykernel>=6", "matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.4", "dask[array]>=2023.1", "nbclient>=0.7", "nbformat>=5.7", "ipykernel>=6", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "NPY", "UP"]
