name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Allow access to private eo-landscape-indicators
        shell: bash
        env:
          EO_TOKEN: ${{ secrets.EO_LANDSCAPE_TOKEN }}
        run: git config --global url."https://x-access-token:${EO_TOKEN}@github.com/kbakousi/eo-landscape-indicators".insteadOf "https://github.com/kbakousi/eo-landscape-indicators"
      - run: pip install -e ".[dev,geo]"
      - run: ruff check .
      - run: pytest
